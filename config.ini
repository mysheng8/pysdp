# pySdp Configuration
# Lines starting with # or ; are comments
# Secrets (API keys) should go in .env file, not here

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
PyLogLevel=info

# SDPCLI server URL (needed for device control / capture proxy)
# SdpcliUrl=http://localhost:5000

# ---------------------------------------------------------------------------
# Paths (override if not using monorepo layout)
# ---------------------------------------------------------------------------
# WorkingDirectory=
# ProjectDir=
# SdpDir=
# AnalysisDir=
# ReportDir=

# ---------------------------------------------------------------------------
# LLM (DrawCall labeling / analysis)
# ---------------------------------------------------------------------------
# LlmApiEndpoint=
# LlmApiKey=
# LlmModel=vertex_ai/gemini-2.5-flash-lite
LlmTimeoutSeconds=300
LlmMaxOutputTokens=16000
LlmMaxShaderChars=20000
LlmMaxConcurrentRequests=16

# ---------------------------------------------------------------------------
# VLM (Vision / screenshot analysis)
# ---------------------------------------------------------------------------
# VlmApiEndpoint=
# VlmApiKey=
# VlmModel=
VlmTimeoutSeconds=60
VlmMaxOutputTokens=2000
VlmTextureDescriptionEnabled=false
VlmTextureMinSize=64
VlmTextureMaxConcurrent=4

# ---------------------------------------------------------------------------
# Chat AI (WebUI sidebar)
# ---------------------------------------------------------------------------
# ChatApiEndpoint=
# ChatApiKey=
# ChatModel=vertex_ai/gemini-2.5-flash
ChatMaxTokens=8192
ChatTimeoutSeconds=120

# ---------------------------------------------------------------------------
# LLM Cache
# ---------------------------------------------------------------------------
LlmCacheEnabled=true
LlmCacheOverride=false
LlmCacheSize=512
# LlmCachePath=

# ---------------------------------------------------------------------------
# Analysis
# ---------------------------------------------------------------------------
AnalysisCategories=Scene,Terrain,Character,Scene(Shadow),Terrain(Shadow),Character(Shadow),PostProcess,VFX,UI,Other
# AttributionRulesPath=

# ---------------------------------------------------------------------------
# WebUI
# ---------------------------------------------------------------------------
WebSnapshotId=1
WebTargets=screenshot,ingest,dc,shaders,textures,buffers,label,metrics,status,topdc,report

# ---------------------------------------------------------------------------
# GLES
# ---------------------------------------------------------------------------
GlesLlmDecompile=true
GlesLlmDecompileMaxLines=500

# ---------------------------------------------------------------------------
# Shader Tools
# ---------------------------------------------------------------------------
# Path to Vulkan SDK root (for spirv-cross shader decompilation)
# spirv-cross is expected at {VulkanSDKPath}/Bin/spirv-cross.exe
# VulkanSDKPath=

# Path to ir3-disasm.exe (Mesa freedreno, for GLES Adreno IR3 disassembly)
Ir3DisasmPath=tools/ir3-disasm.exe

# Adreno chip ID for ir3-disasm (hex). Auto-detected at runtime; override only if needed.
# Adreno 730 = 0x07030001, Adreno 660 = 0x06030001
Ir3ChipId=

# Shader decompilation output format: hlsl, glsl, both
ShaderOutputFormat=hlsl
